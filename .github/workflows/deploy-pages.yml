# 푸시할 때마다 테스트 후 미리보기 빌드를 gh-pages 브랜치에 올린다.
# 저장소 Settings → Pages → Source를 "Deploy from a branch", 브랜치 gh-pages / (root)로 한 번 설정하면 된다.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:preview

      - name: Push dist to gh-pages
        working-directory: dist
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${SOURCE_REF}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
